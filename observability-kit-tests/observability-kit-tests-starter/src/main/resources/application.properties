server.port=8080
# The insights endpoint carries the detail of a browser error, which the
# vaadin.client.errors counter cannot; ClientProblemsIT reads it from here.
management.endpoints.web.exposure.include=prometheus,metrics,vaadin
management.endpoint.prometheus.access=unrestricted
management.endpoint.vaadin.access=unrestricted

# UI state size metrics are opt-in (they walk the component tree of the UI an
# interaction touched), so the browser ITs turn them on to exercise the binder.
vaadin.observability.ui-state=true
