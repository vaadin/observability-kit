server.port=8080
management.endpoints.web.exposure.include=prometheus,metrics
management.endpoint.prometheus.access=unrestricted

# UI state size metrics are opt-in (they walk the component tree of the UI an
# interaction touched), so the browser ITs turn them on to exercise the binder.
vaadin.observability.ui-state=true

# The browser ITs run against a production-mode bundle, where Flow publishes
# its client-side profiling data only on request. This is the same switch a
# production deployment flips to record vaadin.client.render.duration.
vaadin.requestTiming=true
